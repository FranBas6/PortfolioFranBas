# Netlify: build, root redirect by language, security and cache headers.

[build]
  command = "npm run build"   # prebuild runs scripts/check-content.mjs
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# --- Root redirect -----------------------------------------------------------
# Spanish only if the browser prefers Spanish; English for everyone else.
# Temporary (302) on purpose. Inner pages never redirect by language.
# How Netlify handles a browser listing several languages is tested in phase 5.

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true
  conditions = { Language = ["es"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# --- Headers -----------------------------------------------------------------
# Strict CSP: every script and stylesheet is an external file from this site
# (astro.config.mjs disables inlining). Images may be data: URIs (the 1 × 1
# placeholder of the hero picture and the form's error icon). The form posts to
# this same site (Netlify Forms). JSON-LD is a data block, not a script.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://franbasguil.goatcounter.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

# Hashed build assets never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font files are not hashed: rename the file if it ever changes.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scripts in /js/ carry their version in the file name: a new version is a new file.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CVs are replaced under the same name, so keep them fresh.
[[headers]]
  for = "/cv/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
